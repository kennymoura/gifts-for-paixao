<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gifts for Paixão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3ebdc;--card:#fbf7ee;--ink:#5a3a3d;--muted:#9a7a7c;--accent:#c4767f;--line:#e6d9c4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f3ebdc;--card:#fbf7ee;--ink:#5a3a3d;--muted:#9a7a7c;--accent:#c4767f;--line:#e6d9c4}}
:root[data-theme="dark"]{--bg:#2a2220;--card:#352b28;--ink:#f3ebdc;--muted:#c8b6a6;--accent:#e39aa3;--line:#4d403b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{text-align:center;padding:40px 20px 16px}
h1{font-family:'Press Start 2P','Courier New',monospace;font-weight:400;font-size:clamp(1.6rem,7.5vw,2.4rem);line-height:1.4;margin:0 auto 16px;color:var(--accent);display:table;position:relative;padding-right:2em}
h1 span{display:block;text-align:right;white-space:nowrap}
h1 span+span{font-size:1.5em;margin-top:.2em}
.pheart{position:absolute;right:0;top:1.7em;width:1.7em;height:1.457em;fill:var(--accent)}
.pheart .hl{fill:var(--bg)}
header p{margin:0;color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px;font-family:system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.tile .photo{height:230px;padding:16px}
.photo{display:flex;align-items:center;justify-content:center;background:var(--bg)}
.photo img{max-width:100%;max-height:100%;height:auto}
.tile .t{padding:14px 16px 18px}
.brand{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--muted);margin:0}
.tile h2{font-family:Georgia,serif;font-size:1.05rem;margin:4px 0 8px}
.meta{display:flex;justify-content:space-between;align-items:center}
.hearts{color:var(--accent);letter-spacing:2px}
.hearts .off{opacity:.25}
.price{font-weight:700}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-wrap:wrap}
.card .photo{flex:1 1 240px;padding:24px;min-height:300px}
.card .photo img{max-height:380px}
.info{flex:2 1 280px;padding:24px;font-family:'Google Sans',system-ui,sans-serif}
.info h2{font-family:Georgia,serif;font-size:1.5rem;margin:4px 0 8px}
.desc{margin:0 0 16px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.label{color:var(--muted)}
.row .price{font-size:1.15rem}
.btn{display:block;text-align:center;margin-top:16px;padding:14px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.btn:hover{opacity:.9}
</style></head><body>
